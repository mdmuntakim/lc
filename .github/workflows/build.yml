name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build a signed release (creates dist/lc-<version>-arm64.apk)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Debug build + unit tests (every push)
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew --no-daemon :app:assembleDebug :app:test

      - name: Signed release (workflow_dispatch with release=true)
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'true'
        run: bash scripts/build-release.sh

      - name: Upload the signed APK
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lc-release-apk
          path: dist/*.apk
          if-no-files-found: error
